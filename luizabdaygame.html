<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La mulți ani, Ana! 🎉</title>
<meta property="og:title" content="La mulți ani, Ana! 🎉">
<meta property="og:description" content="Un triatlon aniversar doar pentru tine: motor, snowboard și dinți.">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#1b1f4a 0%,#7b3f8c 45%,#ff7a59 78%,#ffc46b 100%);color:#3a2340}
#mtn{position:fixed;left:0;right:0;bottom:0;height:30vh;background:#2a1d3d;clip-path:polygon(0 100%,0 55%,12% 30%,22% 50%,36% 12%,48% 42%,60% 8%,72% 40%,84% 20%,100% 48%,100% 100%)}
#cv{position:fixed;inset:0;display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:none;justify-content:space-between;padding:14px 62px 12px 14px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.3);font-size:20px;cursor:pointer}
#dental{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:4;padding:70px 16px 16px}
#dental .lbl{font-weight:800;font-size:20px;color:#2a6b5f;margin-bottom:14px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(92vw,420px)}
.tooth{aspect-ratio:1;border:0;border-radius:22px;background:#fff;box-shadow:0 6px 0 #bfe3dc,0 8px 16px rgba(0,0,0,.12);font-size:min(14vw,60px);position:relative;cursor:pointer}
.tooth.sick{background:#fff1b8;box-shadow:0 6px 0 #e0b84a,0 8px 16px rgba(0,0,0,.12);animation:wob .35s infinite}
.tooth.cand{background:#ffe0ef;box-shadow:0 6px 0 #ff9cc0,0 8px 16px rgba(0,0,0,.12)}
.tooth .b{position:absolute;right:4%;top:2%;font-size:.6em}
.tooth.fix{animation:fix .3s}
#dental,#dental *{cursor:none}
#drill{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:6;display:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
#drill.buzz svg{animation:buzz .05s linear 5}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1.5px)}75%{transform:translate(1px,1px)}100%{transform:translate(0,0)}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;background:rgba(27,31,74,.3)}
#ov.clear{background:transparent;pointer-events:none}
#ov.hide{display:none}
.card{background:#fff6ea;color:#3a2340;border-radius:24px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(27,31,74,.45);max-height:92vh;overflow:auto;animation:in .35s ease-out;touch-action:pan-y}
.card h1{font-size:30px;line-height:1.15;margin:8px 0;background:linear-gradient(90deg,#d9480f,#c2255c);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:22px;margin:6px 0 10px;color:#3a2340}
.card p{font-size:16px;line-height:1.5;color:#5a4560;margin:8px 0}
.em{font-size:54px;letter-spacing:6px}
.go{margin:16px 6px 0;border:0;border-radius:999px;padding:14px 26px;font-size:18px;font-weight:800;color:#fff;background:#ff7a59;box-shadow:0 6px 0 #c4502f;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #c4502f}
.go.alt{background:#f1e2cf;color:#3a2340;box-shadow:0 6px 0 #d8c3a8}
.big{font-size:min(30vw,160px);font-weight:900;color:#fff6ea;text-shadow:0 6px 20px rgba(27,31,74,.6);animation:pop .5s}
.row{display:flex;justify-content:center;gap:16px;font-size:18px;font-weight:700;margin:8px 0}
.tot{font-size:42px;font-weight:900;color:#c2255c;line-height:1}
.small{font-size:13px!important;color:#8a7680!important}
/* cake */
.cake{position:relative;width:220px;height:165px;margin:4px auto 0}
.plate{position:absolute;bottom:0;left:0;width:220px;height:14px;border-radius:50%;background:#e9d6c0}
.t1{position:absolute;bottom:7px;left:20px;width:180px;height:60px;background:#ff9cc0;border-radius:10px 10px 6px 6px;box-shadow:inset 0 -8px 0 rgba(194,37,92,.25)}
.t1::after{content:'❤ ❤ ❤ ❤';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff6ea;font-size:16px;letter-spacing:4px}
.t2{position:absolute;bottom:64px;left:45px;width:130px;height:46px;background:#fff6ea;border:3px solid #ff9cc0;border-radius:10px 10px 4px 4px}
.t2::after{content:'';position:absolute;left:-3px;right:-3px;top:-3px;height:12px;background:#c2255c;border-radius:10px 10px 8px 8px}
.cdl{position:absolute;width:6px;height:22px;border-radius:2px;background:repeating-linear-gradient(45deg,#fff 0 3px,#ff7a59 3px 6px);animation:drop .5s cubic-bezier(.3,1.4,.6,1) both}
.cdl::after{content:'';position:absolute;left:50%;top:-13px;width:8px;height:12px;margin-left:-4px;background:radial-gradient(circle at 50% 70%,#fff3a0,#ffb100 55%,#ff5a00);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .18s infinite alternate}
.cnt{font-size:30px!important;font-weight:900;color:#d9480f!important;margin:4px 0 0!important}
.rest{opacity:0;transition:opacity .8s}
.rest.show{opacity:1}
/* letter */
.letter{position:relative;background:repeating-linear-gradient(#fffdf7 0 27px,#f3d9c9 27px 28px);border-radius:6px;padding:30px 16px 18px 32px;margin:26px 0 8px;text-align:left;box-shadow:0 8px 20px rgba(58,35,64,.2);transform:rotate(-1.2deg)}
.letter::before{content:'';position:absolute;left:22px;top:0;bottom:0;width:2px;background:#f4a3a3}
.seal{position:absolute;top:-18px;left:50%;margin-left:-19px;width:38px;height:38px;border-radius:50%;background:#c2255c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.msg,.sig{font-family:"Bradley Hand","Segoe Print","Snell Roundhand","Comic Sans MS",cursive;color:#3a2340}
.msg{white-space:pre-line;font-size:17px;line-height:28px}
.sig{text-align:right;font-size:20px;line-height:28px;color:#c2255c;margin-top:4px}
.hearts{position:absolute;left:30px;bottom:6px;font-size:14px}
.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:5px solid #ff9cc0;margin:0 auto 6px;display:block}
@keyframes drop{from{transform:translateY(-180px) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12,1.25) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fix{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes in{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mtn"></div>
<canvas id="cv"></canvas>
<div id="hud"><span id="hStage"></span><span id="hTime"></span><span id="hCand"></span><span id="hScore"></span></div>
<div id="dental"><div class="lbl">🩺 Clinica Dr. Ana</div><div id="grid"></div></div>
<div id="drill"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <line x1="5" y1="59" x2="13" y2="51" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="30" y2="34" stroke="#cfd8df" stroke-width="7" stroke-linecap="round"/>
  <line x1="30" y1="34" x2="58" y2="6" stroke="#9fb0bd" stroke-width="11" stroke-linecap="round"/>
  <line x1="34" y1="30" x2="38" y2="26" stroke="#ff7a59" stroke-width="11"/>
  <circle cx="15" cy="49" r="6" fill="#e9eef2" stroke="#9fb0bd" stroke-width="2"/>
</svg></div>
<div id="ov" class="hide"></div>
<canvas id="fx"></canvas>
<button id="snd" aria-label="Sunet">🔊</button>

<script>
/* ====== PERSONALIZE HERE ====== */
const CONFIG = {
  name: 'Ana',
  from: 'Kati',
  message: 'Draga mea Ana,\n\nÎmi pare rău că am întârziat cu o zi! 🙈\nÎți doresc un an plin de aventuri și pacienți care pleacă zâmbind.\n\nSă ai mereu plinul făcut la motor 🏍️, zăpadă pufoasă pe pârtie 🏂 și dinți albi și sănătoși 🦷!\n\nRămâi la fel de curajoasă și de mișto cum ești! ❤️',
  photo: '' // optional: put e.g. 'luiza.jpg' in the same folder and write its name here
};
/* ============================== */

const STAGE_TIME = 20;
const STAGES = [
  {key:'moto', emoji:'🏍️', title:'Etapa 1: Transfăgărășan', info:'<b>Trage cu degetul</b> stânga-dreapta oriunde pe ecran ca să conduci motorul.<br>Strânge lumânări 🕯️ și torturi 🎂.<br>Evită oile 🐑, urșii 🐻 și pietrele 🪨!'},
  {key:'snow', emoji:'🏂', title:'Etapa 2: Pârtia din Carpați', info:'<b>Trage cu degetul</b> stânga-dreapta oriunde pe ecran ca să conduci placa.<br>Strânge lumânări 🕯️, cadouri 🎁 și stele ⭐.<br>Evită brazii 🌲 și dulciurile 🍬 (doctorița nu aprobă!)'},
  {key:'dent', emoji:'🦷', title:'Etapa 3: Clinica Dr. Ana', info:'Ia <b>freza</b> și atinge dinții cu carii 🦠 cât mai repede!<br>Bonus: strânge lumânările 🕯️ de pe dinți.'}
];

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const fxc = $('#fx'), fx = fxc.getContext('2d'); // top layer: confetti falls over everything
const ov = $('#ov'), hud = $('#hud'), dental = $('#dental'), grid = $('#grid');
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let W=0, H=0, S=1;
function resize(){
  const d = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  for(const c of [cv, fxc]){ c.width = W*d; c.height = H*d; c.style.width = W+'px'; c.style.height = H+'px'; }
  ctx.setTransform(d,0,0,d,0,0);
  fx.setTransform(d,0,0,d,0,0);
  S = clamp(Math.min(W,H)/420, 0.8, 1.25);
}
addEventListener('resize', resize); resize();

/* ---------- sound ---------- */
let AC = null, soundOn = store.get('lz_sound') !== '0';
const sndBtn = $('#snd');
sndBtn.textContent = soundOn ? '🔊' : '🔇';
sndBtn.onclick = () => { soundOn = !soundOn; store.set('lz_sound', soundOn?'1':'0'); sndBtn.textContent = soundOn ? '🔊' : '🔇'; };
function beep(f, d=0.1, type='sine', v=0.15, delay=0){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function happyBirthday(){
  const n = [[392,.3],[392,.15],[440,.45],[392,.45],[523,.45],[494,.8],[392,.3],[392,.15],[440,.45],[392,.45],[587,.45],[523,.9]];
  let t = 0; n.forEach(([f,d]) => { beep(f, d*0.95, 'triangle', 0.14, t); t += d; });
}

/* ---------- state ---------- */
let candles = 0, finalTimers = [];
let state = 'intro', stage = 0, scores = [0,0,0], timeLeft = STAGE_TIME, paused = false, cdT = null;
let items = [], floats = [], trail = [], confetti = [], spawnT = 0, scroll = 0, shake = 0, invuln = 0;
const P = {x:0, y:0, tx:0, vx:0};
let drag = null; // finger drag: rider moves by how far the finger moves (relative)
let teeth = [];

function showOv(html, clear=false){ ov.innerHTML = html; ov.className = clear ? 'clear' : ''; }
function hideOv(){ ov.className = 'hide'; ov.innerHTML = ''; }
function addFloat(x, y, txt, c='#fff'){ floats.push({x, y, txt, c, t:0}); }
function laneW(){ return Math.min(W/4.2, 130); } // narrower road leaves room for forest on phones
function laneX(i){ return W/2 + (i-1)*laneW(); }
function cur(){ return STAGES[stage].key; }
function addScore(p){ scores[stage] = Math.max(0, scores[stage] + p); }
function updateHud(){
  $('#hStage').textContent = `${STAGES[stage].emoji} ${stage+1}/3`;
  $('#hTime').textContent = `⏱ ${Math.ceil(Math.max(0,timeLeft))}`;
  $('#hCand').textContent = `🕯️ ${candles}`;
  $('#hScore').textContent = `⭐ ${scores[stage]}`;
}

/* ---------- confetti ---------- */
function makeConfetti(n){
  const cols = ['#ff7a59','#ffc46b','#c2255c','#ff9cc0','#7b3f8c','#fff6ea'];
  const hearts = ['❤️','💕','💖'];
  confetti = [];
  for(let i=0;i<n;i++) confetti.push({x:Math.random()*W, y:Math.random()*H - H, vx:(Math.random()-.5)*40, vy:60+Math.random()*120, r:Math.random()*6, vr:(Math.random()-.5)*6, c:cols[i%cols.length], w:6+Math.random()*6, h:10+Math.random()*8, heart: Math.random() < 0.18 ? hearts[i%3] : null});
}

/* ---------- screens ---------- */
function showIntro(){
  state = 'intro'; hud.style.display = 'none'; dental.style.display = 'none';
  confetti = [];
  showOv(`<div class="card">
    <div class="em">🏍️🏂🦷</div>
    <h1>La mulți ani, ${CONFIG.name}! 🎉</h1>
    <p>Strânge cât mai multe <b>lumânări 🕯️</b> pentru tortul de la final!</p>
    <p class="small">3 etape · 20 de secunde fiecare · la final te așteaptă o surpriză</p>
    <button class="go" id="st">Începe aventura 🚀</button></div>`);
  $('#st').onclick = () => { beep(660,.1); showStageIntro(0); };
}

function showStageIntro(i){
  stage = i; state = 'stageIntro'; confetti = [];
  if(i === 0){ candles = 0; finalTimers.forEach(clearTimeout); finalTimers = []; }
  setupStage(i);
  showOv(`<div class="card"><div class="em">${STAGES[i].emoji}</div><h2>${STAGES[i].title}</h2><p>${STAGES[i].info}</p><button class="go" id="gt">Gata! 💪</button></div>`);
  $('#gt').onclick = countdown;
}

function setupStage(i){
  items = []; floats = []; trail = []; spawnT = 0.6; scroll = 0; invuln = 0; shake = 0;
  timeLeft = STAGE_TIME; scores[i] = 0; paused = false;
  P.x = P.tx = W/2; P.vx = 0; drag = null;
  hud.style.display = 'flex';
  if(STAGES[i].key === 'dent'){ buildTeeth(); dental.style.display = 'flex'; moveDrill(W*0.6, H*0.6); } else dental.style.display = 'none';
  updateHud();
}

function countdown(){
  state = 'countdown'; let n = 3;
  const step = () => {
    if(n > 0){ showOv(`<div class="big">${n}</div>`, true); beep(440,.12); n--; cdT = setTimeout(step, 700); }
    else { showOv(`<div class="big">Start!</div>`, true); beep(880,.2); cdT = setTimeout(() => { hideOv(); state = 'play'; }, 450); }
  };
  step();
}

function endStage(){
  if(state !== 'play') return;
  state = 'between'; dental.style.display = 'none';
  const last = stage === 2;
  beep(523,.12,'triangle',.14); beep(659,.12,'triangle',.14,.12); beep(784,.25,'triangle',.14,.24);
  showOv(`<div class="card"><div class="em">${STAGES[stage].emoji}</div><h2>Etapă terminată!</h2><p class="tot">+${scores[stage]}</p><p>puncte</p><button class="go" id="nx">${last ? 'Vezi surpriza 🎁' : 'Următoarea etapă ➜'}</button></div>`);
  $('#nx').onclick = () => last ? showFinal() : showStageIntro(stage+1);
}

function rating(t){
  if(t < 150) return 'Aventurieră în devenire 🌱';
  if(t < 300) return 'Exploratoare a Carpaților 🏔️';
  if(t < 450) return 'Regina Transfăgărășanului 👑';
  return 'Legendă absolută 🦄';
}

function showFinal(){
  state = 'final'; hud.style.display = 'none'; dental.style.display = 'none';
  const total = scores[0] + scores[1] + scores[2];
  const best = Math.max(total, +(store.get('lz_best')||0)); store.set('lz_best', best);
  const n = Math.max(1, candles);           // at least one candle on the cake
  const shown = Math.min(n, 24);            // visual cap, the counter still shows the real number
  const step = Math.min(0.25, 2.4/shown);   // seconds between candles
  const animDur = reduced ? 0 : shown*step + 0.5;
  makeConfetti(reduced ? 30 : 70);
  showOv(`<div class="card">
    ${CONFIG.photo ? `<img class="photo" src="${CONFIG.photo}" alt="">` : '<div class="em">🏍️🏂🦷</div>'}
    <h1>La mulți ani, ${CONFIG.name}! 🎉</h1>
    <div class="cake" id="cake"><div class="plate"></div><div class="t1"></div><div class="t2"></div></div>
    <p class="cnt" id="cnt">🕯️ 0</p>
    <p>${candles ? 'lumânări strânse pentru tortul tău! 🎂' : 'Nicio lumânare? Ți-am pus eu una 😉'}</p>
    <div class="rest" id="rest">
      <div class="row"><span>🏍️ ${scores[0]}</span><span>🏂 ${scores[1]}</span><span>🦷 ${scores[2]}</span></div>
      <p class="tot">${total}</p>
      <p><b>Titlul tău:</b> ${rating(total)}</p>
      <p class="small">Record: ${best}</p>
      <div class="letter"><div class="seal">❤️</div><div class="msg" id="msg"></div><div class="sig" id="sig"></div><div class="hearts">💕</div></div>
      <button class="go alt" id="again">Joacă din nou 🔁</button>
      ${navigator.share ? '<button class="go" id="share">Trimite 📤</button>' : ''}
    </div>
  </div>`);
  $('#msg').textContent = CONFIG.message;
  $('#sig').textContent = `Cu mult drag, ${CONFIG.from} ❤️`;

  // candles drop onto the cake one by one
  const cake = $('#cake'), rows = shown > 12 ? 2 : 1, per = Math.ceil(shown/rows);
  for(let i=0;i<shown;i++){
    const r = i % rows, k = Math.floor(i/rows);
    const x = 52 + (per === 1 ? 59 : k * (112/(per-1))) + (r ? 4 : 0);
    const c = document.createElement('div');
    c.className = 'cdl';
    c.style.left = x + 'px';
    c.style.bottom = (rows === 1 ? 108 : (r ? 113 : 104)) + 'px';
    c.style.zIndex = r ? 1 : 3;
    c.style.animationDelay = (i*step) + 's';
    cake.appendChild(c);
    if(!reduced) finalTimers.push(setTimeout(() => beep(600 + i*25, .06, 'triangle', .08), i*step*1000 + 350));
  }
  const cnt = $('#cnt'), rest = $('#rest');
  if(reduced){ cnt.textContent = `🕯️ ${candles}`; rest.classList.add('show'); happyBirthday(); }
  else {
    const t0 = performance.now(), dur = shown*step*1000 + 350;
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0)/dur);
      cnt.textContent = `🕯️ ${Math.round(candles*p)}`;
      if(p < 1 && state === 'final') requestAnimationFrame(tick);
    };
    tick();
    finalTimers.push(setTimeout(() => {
      if(state !== 'final') return;
      rest.classList.add('show'); happyBirthday();
      const old = confetti; makeConfetti(160); confetti = old.concat(confetti); // extra burst
    }, animDur*1000));
  }
  $('#again').onclick = () => { scores = [0,0,0]; showStageIntro(0); };
  const sh = $('#share');
  if(sh) sh.onclick = () => navigator.share({title:'Triatlonul aniversar', text:`Am făcut ${total} puncte în triatlonul meu aniversar! 🎉`, url:location.href}).catch(()=>{});
}

/* ---------- dental ---------- */
function buildTeeth(){
  grid.innerHTML = '';
  teeth = [];
  for(let i=0;i<9;i++){
    const el = document.createElement('button');
    el.className = 'tooth';
    el.innerHTML = '<span>🦷</span><span class="b"></span>';
    el.addEventListener('pointerdown', e => { e.preventDefault(); tapTooth(i); });
    grid.appendChild(el);
    teeth.push({el, st:'ok', t:0});
  }
}
// dental drill that follows the finger / mouse (tip of the bur is the touch point)
const drillEl = $('#drill');
function moveDrill(x, y){ drillEl.style.transform = `translate(${x-5}px, ${y-59}px)`; }
function buzzDrill(){
  drillEl.classList.remove('buzz'); void drillEl.offsetWidth; drillEl.classList.add('buzz');
  beep(1700, .12, 'sawtooth', .03); beep(2100, .1, 'square', .015, .03);
}
dental.addEventListener('pointerdown', e => { moveDrill(e.clientX, e.clientY); if(state === 'play' && !paused) buzzDrill(); });
dental.addEventListener('pointermove', e => moveDrill(e.clientX, e.clientY));
function renderTooth(th){
  th.el.querySelector('.b').textContent = th.st === 'bad' ? '🦠' : th.st === 'cand' ? '🕯️' : '';
  th.el.classList.toggle('sick', th.st === 'bad');
  th.el.classList.toggle('cand', th.st === 'cand');
}
function tapTooth(i){
  if(state !== 'play' || paused) return;
  const th = teeth[i]; if(th.st === 'ok') return;
  const r = th.el.getBoundingClientRect();
  const pts = th.st === 'cand' ? 20 : 10;
  addScore(pts);
  if(th.st === 'cand') candles++;
  addFloat(r.left + r.width/2, r.top, th.st === 'cand' ? '+20 🎂' : '+10 ✨', '#ff3d7f');
  beep(th.st === 'cand' ? 990 : 760, .08, 'square', .07);
  th.st = 'ok'; renderTooth(th);
  th.el.classList.remove('fix'); void th.el.offsetWidth; th.el.classList.add('fix');
}
function updateDental(dt, pr){
  spawnT -= dt;
  if(spawnT <= 0){
    spawnT = 0.85 - 0.45*pr;
    const free = teeth.filter(t => t.st === 'ok');
    if(free.length){
      const th = free[Math.floor(Math.random()*free.length)];
      th.st = Math.random() < 0.15 ? 'cand' : 'bad';
      th.t = 1.7 - 0.8*pr; renderTooth(th);
    }
  }
  teeth.forEach(th => { if(th.st !== 'ok'){ th.t -= dt; if(th.t <= 0){ th.st = 'ok'; renderTooth(th); } } });
}

/* ---------- moto ---------- */
function hit(e){
  e.dead = true;
  if(e.pts > 0){
    addScore(e.pts); if(e.em === '🕯️') candles++;
    addFloat(e.x, e.y, '+' + e.pts, '#ffd23f'); beep(880,.08,'square',.07); beep(1175,.08,'square',.06,.06);
  } else if(invuln <= 0){
    addScore(e.pts); addFloat(e.x, e.y, e.say, '#ff4d4d');
    shake = 0.3; invuln = 0.8; beep(140,.25,'sawtooth',.12);
    if(navigator.vibrate) try{ navigator.vibrate(60); }catch(err){}
  }
}
function updateMoto(dt, pr){
  const ramp = Math.min(1, pr*1.6);          // reaches top speed after ~12 s
  const speed = (230 + 420*ramp) * (H/700);
  scroll += speed*dt;
  const lw = laneW();
  P.tx = clamp(P.tx, W/2 - lw*1.2, W/2 + lw*1.2);
  P.x += (P.tx - P.x) * Math.min(1, dt*40);
  P.y = H*0.8;
  spawnT -= dt;
  if(spawnT <= 0){
    spawnT = 0.85 - 0.45*ramp + Math.random()*0.2;
    const lane = Math.floor(Math.random()*3);
    let e;
    if(Math.random() < 0.45) e = Math.random() < 0.2 ? {em:'🎂', pts:25} : {em:'🕯️', pts:10};
    else e = [{em:'🐑',pts:-10,say:'Beee! 🐑'},{em:'🐻',pts:-10,say:'Aoleu! 🐻'},{em:'🪨',pts:-10,say:'Au!'},{em:'🐄',pts:-10,say:'Muuu!'}][Math.floor(Math.random()*4)];
    e.lane = lane; e.y = -40; items.push(e);
  }
  for(const e of items){
    e.x = laneX(e.lane); e.y += speed*dt;
    // forgiving: small hitbox for obstacles, big one for goodies
    const rx = e.pts > 0 ? lw*0.55 : lw*0.33, ry = e.pts > 0 ? 42*S : 28*S;
    if(!e.dead && Math.abs(e.x - P.x) < rx && Math.abs(e.y - P.y) < ry) hit(e);
  }
  items = items.filter(e => !e.dead && e.y < H + 80);
}
function drawMoto(){
  const lw = laneW(), rl = W/2 - lw*1.5, rr = W/2 + lw*1.5;
  ctx.fillStyle = '#4f9a3f'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#5a5a5f'; ctx.fillRect(rl,0,rr-rl,H);
  ctx.fillStyle = '#fff'; ctx.fillRect(rl,0,4,H); ctx.fillRect(rr-4,0,4,H);
  ctx.fillStyle = '#f5d742';
  const off = scroll % 60;
  for(let k=1;k<3;k++){ const x = rl + lw*k - 2; for(let y=-60+off; y<H; y+=60) ctx.fillRect(x, y, 4, 30); }
  // pine forest on both sides, scrolling with the road
  const side = rl, ts = clamp(side*0.7, 22, 46), gap = ts*1.15;
  const cols = Math.max(1, Math.floor(side / (ts*0.9)));
  const span = H + gap*2;
  for(let c=0;c<cols;c++){
    const cx = side * (c + 0.5) / cols;
    for(let k=0; k*gap < span; k++){
      const y = ((k*gap + scroll + (c%2)*gap*0.5) % span) - gap;
      emoji('🌲', cx, y, ts);
      emoji('🌲', W - cx, y, ts);
    }
  }
  drawItems();
  if(invuln <= 0 || Math.floor(invuln*12)%2) emoji('🏍️', P.x, P.y, 50*S);
}

/* ---------- snow ---------- */
function updateSnow(dt, pr){
  const speed = (190 + 170*pr) * (H/700);
  scroll += speed*dt;
  const px = P.x;
  P.tx = clamp(P.tx, 24, W-24);
  P.x += (P.tx - P.x) * Math.min(1, dt*40);
  P.vx = (P.x - px) / Math.max(dt, 0.001);
  P.y = H*0.3;
  for(const t of trail) t.y -= speed*dt;
  trail.push({x:P.x, y:P.y + 18*S}); if(trail.length > 40) trail.shift();
  spawnT -= dt;
  if(spawnT <= 0){
    spawnT = 0.75 - 0.25*pr + Math.random()*0.15;
    let e;
    if(Math.random() < 0.5){ const g = Math.random(); e = g < 0.4 ? {em:'🕯️', pts:10} : g < 0.6 ? {em:'⭐', pts:15} : {em:'🎁', pts:10}; }
    else e = Math.random() < 0.55 ? {em:'🌲', pts:-10, say:'Bum! 🌲'} : {em:Math.random()<.5?'🍬':'🍭', pts:-10, say:'🦷 Nu, nu!'};
    e.x = 30 + Math.random()*(W-60); e.y = H + 40; items.push(e);
  }
  for(const e of items){
    e.y -= speed*dt;
    if(!e.dead && Math.hypot(e.x - P.x, e.y - P.y) < (e.pts > 0 ? 46 : 26)*S) hit(e);
  }
  items = items.filter(e => !e.dead && e.y > -80);
}
function drawSnow(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#cfe9ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(120,170,220,.25)';
  for(let k=0;k<30;k++){ const x = (k*97) % W, y = (H - ((k*53 + scroll) % (H+20))); ctx.fillRect(x, y, 14, 2); }
  if(trail.length > 1){
    ctx.strokeStyle = 'rgba(110,150,200,.5)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y); for(const t of trail) ctx.lineTo(t.x, t.y); ctx.stroke();
  }
  drawItems();
  if(invuln <= 0 || Math.floor(invuln*12)%2){
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(clamp(P.vx*0.0015, -0.5, 0.5));
    emoji('🏂', 0, 0, 50*S); ctx.restore();
  }
}

function drawDental(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#d8fff5'); g.addColorStop(1,'#a8e6d8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

/* ---------- drawing helpers ---------- */
// Emojis are slow to draw as text on phones, so each one is drawn once into a small image and reused.
const emojiCache = new Map();
function emoji(ch, x, y, size){
  size = Math.round(size);
  const key = ch + '|' + size;
  let c = emojiCache.get(key);
  if(!c){
    const d = Math.min(window.devicePixelRatio||1, 2), s = Math.ceil(size*1.4);
    c = document.createElement('canvas'); c.width = c.height = s*d; c._s = s;
    const g = c.getContext('2d'); g.scale(d,d);
    g.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, s/2, s/2);
    emojiCache.set(key, c);
  }
  ctx.drawImage(c, x - c._s/2, y - c._s/2, c._s, c._s);
}
function drawItems(){ for(const e of items) emoji(e.em, e.x, e.y, 42*S); }
function drawFloats(){
  ctx.font = `bold ${22*S}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const f of floats){
    ctx.globalAlpha = 1 - f.t/0.9; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.c; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function drawConfetti(dt){
  for(const p of confetti){
    p.x += p.vx*dt; p.y += p.vy*dt*(reduced ? 0.4 : 1); p.r += p.vr*dt;
    if(p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
    fx.save(); fx.translate(p.x, p.y);
    if(p.heart){
      fx.rotate(Math.sin(p.r)*0.4);
      fx.font = `${p.h+6}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      fx.textAlign = 'center'; fx.textBaseline = 'middle'; fx.fillText(p.heart, 0, 0);
    } else { fx.rotate(p.r); fx.fillStyle = p.c; fx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
    fx.restore();
  }
}

/* ---------- input ---------- */
// Drag anywhere: the rider moves by the same distance as the finger, so the finger never hides the road.
cv.addEventListener('pointerdown', e => {
  if(cur() === 'dent') return;
  drag = {id:e.pointerId, sx:e.clientX, px:P.tx};
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id || state !== 'play' || paused) return;
  P.tx = drag.px + (e.clientX - drag.sx) * 1.3;
});
const endDrag = e => { if(drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if(state !== 'play' || paused || cur() === 'dent') return;
  const d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0; if(!d) return;
  P.tx = P.x + d * (cur() === 'moto' ? laneW() : W*0.18);
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden && state === 'play' && !paused){
    paused = true;
    showOv(`<div class="card"><div class="em">⏸️</div><h2>Pauză</h2><button class="go" id="rs">Continuă ▶️</button></div>`);
    $('#rs').onclick = () => { hideOv(); paused = false; };
  }
});

/* ---------- loop ---------- */
let last = performance.now(), fxUsed = false;
function loop(t){
  const dt = Math.min((t - last)/1000, 0.05); last = t;
  const active = !paused;
  if(state === 'play' && active){
    timeLeft -= dt;
    const pr = clamp(1 - timeLeft/STAGE_TIME, 0, 1);
    if(invuln > 0) invuln -= dt;
    if(cur() === 'moto') updateMoto(dt, pr);
    else if(cur() === 'snow') updateSnow(dt, pr);
    else updateDental(dt, pr);
    updateHud();
    if(timeLeft <= 0) endStage();
  }
  if(active){
    for(const f of floats){ f.t += dt; f.y -= 50*dt; }
    floats = floats.filter(f => f.t < 0.9);
    if(shake > 0) shake -= dt;
  }
  ctx.save();
  if(shake > 0 && !reduced) ctx.translate((Math.random()-.5)*12*shake/0.3, (Math.random()-.5)*12*shake/0.3);
  ctx.clearRect(-20,-20,W+40,H+40);
  if(['stageIntro','countdown','play','between'].includes(state)){
    if(cur() === 'moto') drawMoto(); else if(cur() === 'snow') drawSnow(); else drawDental();
  }
  drawFloats();
  ctx.restore();
  const showDrill = cur() === 'dent' && (state === 'play' || state === 'countdown') ? 'block' : 'none';
  if(drillEl.style.display !== showDrill) drillEl.style.display = showDrill;
  // confetti layer: only redraw while confetti is on screen, otherwise leave it idle
  if(state === 'final' && confetti.length){ fx.clearRect(0, 0, W, H); drawConfetti(dt); fxUsed = true; }
  else if(fxUsed){ fx.clearRect(0, 0, W, H); fxUsed = false; }
  requestAnimationFrame(loop);
}

showIntro();
requestAnimationFrame(loop);
</script>
